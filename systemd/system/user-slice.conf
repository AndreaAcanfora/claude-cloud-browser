# Managed by claude-cloud-browser.
# Resource cap for everything user @CB_USER@ runs: the browser, Claude Code and
# whatever Claude launches. Other services on the server are never starved.
[Slice]
MemoryMax=@CB_MEMORY_MAX@
# Without a swap cap, a browser that hits MemoryMax keeps paging into the
# shared swap until the whole server thrashes. With it, only this user slows
# down, and the kernel kills its biggest process if it still does not fit.
MemorySwapMax=@CB_MEMORY_SWAP_MAX@
CPUQuota=@CB_CPU_QUOTA@
