#cloud-config
# claude-cloud-browser: cloud-init user data for a fresh Ubuntu 24.04 server.
# Paste it in your provider's "user data" / "cloud config" field when creating the server.
# Replace the SSH key below with your own public key (for example the one generated by Termius).
# Progress: /var/log/cloud-init-output.log

write_files:
  - path: /etc/claude-cloud-browser/install.env
    permissions: "0644"
    content: |
      CB_SSH_PUBKEY='ssh-ed25519 AAAA... replace-with-your-key'
      CB_TS_HOSTNAME=claude-vps

runcmd:
  - [bash, -c, "apt-get update -qq && apt-get install -y -qq git"]
  # Pin a release tag rather than main for reproducible servers.
  - [git, clone, --depth, "1", https://github.com/AndreaAcanfora/claude-cloud-browser, /opt/claude-cloud-browser]
  - [bash, /opt/claude-cloud-browser/install.sh]
